# Tomcat
server:
  port: 9215

# Spring
spring:
  application:
    name: share-mq
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

# Feign
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 60000

# RocketMQ
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:zhiwen-rocketmq-namesrv:9876}
  producer:
    group: mq-hub-producer-group
    send-message-timeout: 3000
