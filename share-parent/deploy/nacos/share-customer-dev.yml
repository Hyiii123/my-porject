spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${TJ_MYSQL_HOST:127.0.0.1}:${TJ_MYSQL_PORT:13306}/zhiwen_customer?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true
    username: ${TJ_MYSQL_USERNAME:root}
    password: ${TJ_MYSQL_PASSWORD:TjLocalRoot@2026}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.share.customer.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

customer:
  ai:
    base-url: ${TJ_PIXEL_API_BASE_URL:https://ai-pixel.online}
    endpoint-path: ${TJ_PIXEL_API_ENDPOINT:/v1/chat/completions}
    model: ${TJ_PIXEL_API_MODEL:gpt-5.6-luna}
    secret: ${TJ_AI_SECRET:}
    timeout-ms: ${TJ_PIXEL_API_TIMEOUT_MS:30000}
    max-retries: ${TJ_PIXEL_API_MAX_RETRIES:1}
    system-prompt: ${TJ_PIXEL_API_SYSTEM_PROMPT:你是智问学伴的在线客服，请使用简洁、友好、准确的中文回答学习平台用户的问题；不确定时请明确说明，不要编造订单或账号信息。}
  session:
    # 活跃会话超过指定天数无对话自动删除，默认 2 天
    expire-days: ${CUSTOMER_SESSION_EXPIRE_DAYS:2}
    # 定时排查 Cron 表达式，默认每 2 天凌晨 2 点执行一次排查清理 (0 0 2 */2 * ?)
    clean-cron: ${CUSTOMER_SESSION_CLEAN_CRON:0 0 2 */2 * ?}
    # 是否开启定时自动清理任务
    auto-clean-enabled: ${CUSTOMER_SESSION_AUTO_CLEAN_ENABLED:true}
