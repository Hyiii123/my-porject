spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${TJ_MYSQL_HOST:127.0.0.1}:${TJ_MYSQL_PORT:13306}/zhiwen_education?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true
    username: ${TJ_MYSQL_USERNAME:root}
    password: ${TJ_MYSQL_PASSWORD:TjLocalRoot@2026}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 12
      connection-timeout: 3000
      validation-timeout: 1000

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.share.education.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  recommend:
    enabled: true
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://ai-pixel.online/v1}
    model: ${AI_MODEL:gpt-5.6-luna}
    temperature: 0.7
    timeout-ms: 8000
    cache-ttl-minutes: 15
    python-service:
      enabled: true
      url: ${PYTHON_REC_SERVICE_URL:http://127.0.0.1:5000/api/recommend/predict}
      timeout-ms: 2500

