# -------------------------------------------------------------
# 智问学伴前端高并发网关 Nginx 核心配置
# 支持 HTTP/1.1、HTTP/2 多路复用、全双工 WebSocket 与 SSE 长连接
# -------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Nginx 高并发共享内存微缓存 (Microcaching: 30MB 索引, 最大 200MB 缓存)
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=MICROCACHE:30m max_size=200m inactive=60s use_temp_path=off;
proxy_cache_key "$scheme$request_method$host$request_uri";

upstream gateway_backend {
    server gateway:18080;
    keepalive 1024;
}

server {
    listen 80 default_server backlog=8192;
    listen 8080 backlog=8192;
    listen 443 ssl default_server backlog=8192;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # SSL / TLS 与 HTTP/2 证书配置 (自签/生产多路复用)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 操作系统级文件句柄与元数据缓存加速
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # TCP 连接优化与低延迟传输
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 20000;
    proxy_buffers 16 64k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;

    # 高频公共只读接口 Nginx 毫秒级共享内存微缓存 (Microcaching 3秒, 极速卸载 Java 压力)
    location ~* ^/(cs/courses/(portal|statistics|stats|ranking|recommend|baseInfo|catas|simpleInfo|page|teachers)|cs/categorys|customer/faq/public|cs/customer-service/faqs|system/dict/data/type|system/config/configKey|ms/medias/statistics|ds/data/(board|today)|ls/(questions|notes|replies)/page|customer/admin/statistics/overview|cs/admin/statistics/overview) {
        proxy_pass http://gateway_backend;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache MICROCACHE;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 302 5s;
        proxy_cache_valid 404 1s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Microcache "HIT-NGINX" always;
    }

    # 三个前端同源访问 Spring Cloud Gateway (带 WebSocket 与真实 IP 穿透)
    location /prod-api/ {
        proxy_pass http://gateway_backend/;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dev-api/ {
        proxy_pass http://gateway_backend/;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 智能体流式思考 SSE 与 WebSocket 专属无缓冲通道 (Server-Sent Events)
    location ~ ^/cs/courses/recommend(ations)?/stream/ {
        proxy_pass http://gateway_backend;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
    }

    # 微服务全域反向代理
    location ~ ^/(as|auth|system|us|code|schedule|file|profile|ms|rule|customer|cs|ss|ls|es|rs|ts|prs|ps|ds)(/|$) {
        proxy_pass http://gateway_backend;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 课程封面智能透明 WebP 内容协商加速 (支持浏览器 Accept: image/webp 自动升级)
    location ~* ^(/courses/course_\d+)\.png$ {
        add_header Vary Accept;
        if ($http_accept ~* "image/webp") {
            rewrite ^(/courses/course_\d+)\.png$ $1.webp break;
        }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 静态资产 7 天不可变强缓存 (支持 HTTP/2 Multiplexing 多路复用)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|mp4|mov|webp|avif)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 静态与动态高压缩比 GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss font/woff2;
    gzip_min_length 1024;
}
